# Production Configuration for Tomcat Deployment

# Context path for Tomcat deployment
server.servlet.context-path=/chatapp

# Database Configuration (Oracle - uncomment and configure as needed)
#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/freeXDB
